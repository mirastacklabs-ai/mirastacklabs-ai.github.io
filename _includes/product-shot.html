<style>
  .pshot { margin: 0; }
  .pshot__frame {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-card);
    box-shadow: 0 24px 64px rgba(0,0,0,0.45);
  }
  .pshot__frame img { display: block; width: 100%; height: auto; }
  .pshot__cap {
    margin-top: 0.85rem;
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .pshot--wide { max-width: 1100px; margin-inline: auto; }
</style>

<figure class="pshot {% if include.wide %}pshot--wide{% endif %}">
  <div class="pshot__frame">
    <img src="{{ '/assets/img/product/' | append: include.src | append: '.webp' | relative_url }}"
         alt="{{ include.alt }}"
         loading="{{ include.eager | default: 'lazy' }}"
         width="1600" height="1000" />
  </div>
  {% if include.caption %}<figcaption class="pshot__cap">{{ include.caption }}</figcaption>{% endif %}
</figure>
